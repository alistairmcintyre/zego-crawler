[project]
name = "zego-crawler"
version = "0.1.0"
description = "A fast, concurrent, single-domain web crawler."
readme = "README.md"
authors = [
    { name = "Alistair McIntyre", email = "alistairmc6@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
]

[project.scripts]
crawler = "crawler.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",
]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: end-to-end tests against a real local HTTP server",
]

[tool.coverage.run]
source = ["crawler"]
omit = ["*/crawler/__main__.py"]  # exercised via subprocess in integration tests
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]
